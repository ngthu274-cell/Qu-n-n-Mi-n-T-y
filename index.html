<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width,
          initial-scale=1.0,
          maximum-scale=1.0,
          user-scalable=no">

    <title>Tiệm Bún Mắm Miền Tây</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="game">

    <!-- ================= HEADER ================= -->

    <header class="top-header">

        <div class="top-left">

            <button class="round-button" onclick="pauseGame()">
                ⏸
            </button>

            <div>
                <div class="day-title" id="dayText">
                    Ngày 1
                </div>

                <div class="game-time" id="timeText">
                    07:00
                </div>
            </div>

        </div>


        <div class="money-box">

            <span>KẾT</span>

            <strong id="moneyText">
                30.000,0k
            </strong>

        </div>


        <div class="rating-box">

            <div id="starsText">
                ★★★★★
            </div>

            <small id="ratingText">
                5,0 · 0 đánh giá
            </small>

        </div>

    </header>


    <!-- ================= SHOP SCENE ================= -->

    <section class="shop-scene">

        <div class="shop-awning">

            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>

        </div>


        <div class="lantern lantern-left">
            🏮
        </div>

        <div class="lantern lantern-right">
            🏮
        </div>


        <div class="shop-sign">

            <div id="shopNameScene">
                TIỆM BÚN MẮM
            </div>

            <small>
                MIỀN TÂY QUÊ MÌNH
            </small>

        </div>


        <div class="palm-tree palm-one">
            🌴
        </div>

        <div class="palm-tree palm-two">
            🌴
        </div>


        <div class="shop-character" id="mainCharacter">
            👩🏻‍🍳
        </div>


        <div class="customer-bubble" id="customerBubble">
            Trời ơi thơm quá!
        </div>


        <div id="customerScene"></div>


        <div class="shop-counter">

            <div>🍲</div>
            <div>🥣</div>
            <div>🫖</div>
            <div>🥥</div>

        </div>

    </section>


    <!-- ================= TAB MENU ================= -->

    <nav class="tab-menu">

        <button
            class="tab active"
            data-tab="shop"
            onclick="changeTab('shop')">

            🏪
            <span>Tiệm</span>

        </button>


        <button
            class="tab"
            data-tab="warehouse"
            onclick="changeTab('warehouse')">

            🧺
            <span>Kho</span>

        </button>


        <button
            class="tab"
            data-tab="price"
            onclick="changeTab('price')">

            🏷️
            <span>Giá bán</span>

        </button>


        <button
            class="tab"
            data-tab="upgrade"
            onclick="changeTab('upgrade')">

            ⬆️
            <span>Nâng cấp</span>

        </button>


        <button
            class="tab"
            data-tab="decorate"
            onclick="changeTab('decorate')">

            🌸
            <span>Trang trí</span>

        </button>


        <button
            class="tab"
            data-tab="rating"
            onclick="changeTab('rating')">

            ⭐
            <span>Đánh giá</span>

        </button>


        <button
            class="tab"
            data-tab="book"
            onclick="changeTab('book')">

            📒
            <span>Sổ sách</span>

        </button>

    </nav>


    <!-- ================= CONTENT ================= -->

    <main id="content"></main>


    <!-- ================= BOTTOM ================= -->

    <div class="bottom-space"></div>

</div>


<!-- ================= MODAL ================= -->

<div
    id="modal"
    class="modal hidden">

    <div
        id="modalContent"
        class="modal-box">
    </div>

</div>


<!-- ================= TOAST ================= -->

<div id="toast"></div>


<script src="script.js"></script>

</body>
</html>
