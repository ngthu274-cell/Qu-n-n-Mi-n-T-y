<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tiệm Bún Mắm Miền Tây</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="game">

  <!-- HEADER -->
  <header class="topbar">

    <div class="top-left">
      <button class="pause-btn" onclick="openSettings()">☰</button>

      <div>
        <div class="day-title" id="dayTitle">Ngày 1</div>
        <div class="time" id="time">Đóng cửa</div>
      </div>
    </div>

    <div class="money-box">
      <small>KẾT</small>
      <strong id="money">30.000,0k</strong>
    </div>

    <div class="rating-box">
      <div id="stars">★★★★★</div>
      <small>
        <span id="rating">5.0</span> ·
        <span id="reviews">0</span> đánh giá
      </small>
    </div>

  </header>


  <!-- TIỆM -->
  <section class="shop-banner">

    <div class="lantern lantern-left">🏮</div>
    <div class="lantern lantern-right">🏮</div>

    <div class="shop-info">

      <h1 id="shopName">Tiệm Bún Mắm</h1>

      <div class="shop-level">
        Cấp <b id="shopLevel">1</b>
        · Tiệm Bún Mắm
        <div class="level-bar">
          <span id="levelProgress"></span>
        </div>
      </div>

      <div class="shop-actions">
        <button onclick="renameShop()">✏️ Đổi tên quán</button>
        <button onclick="showRanking()">🏆 Bảng xếp hạng</button>
        <button onclick="showRecipe()">🍜 Công thức</button>
      </div>

    </div>

    <div class="character">
      <div class="character-head">👩🏻‍🌾</div>
      <div class="character-body">🌿</div>
    </div>

  </section>


  <!-- MENU -->
  <nav class="main-tabs">

    <button class="main-tab active" onclick="changeTab('warehouse')">
      🛒
      <span>Kho</span>
    </button>

    <button class="main-tab" onclick="changeTab('price')">
      🏷️
      <span>Giá bán</span>
    </button>

    <button class="main-tab" onclick="changeTab('upgrade')">
      ⬆️
      <span>Nâng cấp</span>
    </button>

    <button class="main-tab" onclick="changeTab('decorate')">
      🌸
      <span>Trang trí</span>
    </button>

    <button class="main-tab" onclick="changeTab('ratingTab')">
      ⭐
      <span>Đánh giá</span>
    </button>

    <button class="main-tab" onclick="changeTab('staff')">
      👩🏻‍🍳
      <span>Nhân viên</span>
    </button>

  </nav>


  <!-- CONTENT -->
  <main id="content"></main>


  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">

    <button onclick="changeTab('shop')">
      🏪
      <span>Tiệm</span>
    </button>

    <button onclick="changeTab('warehouse')">
      📦
      <span>Kho</span>
    </button>

    <button onclick="changeTab('staff')">
      👩🏻‍🍳
      <span>Nhân viên</span>
    </button>

    <button onclick="changeTab('upgrade')">
      🔧
      <span>Nâng cấp</span>
    </button>

  </nav>

</div>


<!-- MODAL -->
<div id="modal" class="modal hidden"></div>

<!-- TOAST -->
<div id="toast"></div>


<script src="script.js"></script>

</body>
</html>
